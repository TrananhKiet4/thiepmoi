# OpenAPI 3.1 — actual routes; edit alongside API changes.
openapi: "3.1.0"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "Thiệp mời tốt nghiệp API"
  version: "1.0.0"
  description: "Contract for the implemented Express routes. Base /api/v1; health operations override the server base to /. Success JSON is {data}; errors are {error:{code,message,fields?,requestId?}} (rate limiter errors may omit requestId). All API responses carry X-Request-ID. Personal data, links, exports and previews are private, no-store. IDs are UUIDs, timestamps ISO 8601 UTC. No admin/guest API returns token hashes, encrypted invitation tokens, password hashes or session hashes. Only explicitly authorized admin link/export endpoints return the plaintext invitation URL. JSON limit 100 KB. All guest requests count toward 120/min/IP; guest writes additionally count toward 20/min/token+IP (shared PostgreSQL counters in production; bounded memory in development). Admin owner authorization applies to every selected entity. Content defaults/normalization are defined in packages/contracts/src/index.ts."
servers:
  - {"url":"/api/v1","description":"Same-origin API (development via Vite proxy, production behind HTTPS reverse proxy)"}
tags:
  - {"name":"Authentication"}
  - {"name":"Administration"}
  - {"name":"Guest"}
  - {"name":"Wishes"}
  - {"name":"Excel"}
paths:
  "/admin/auth/login":
    post:
      operationId: "post_admin_auth_login"
      tags: ["Authentication"]
      summary: "Đăng nhập quản trị"
      description: "Accepts an email address or admin, which resolves to the existing account selected by ADMIN_BOOTSTRAP_EMAIL. Verifies its stored Argon2 hash; no public registration or password bypass. Creates a signed sid cookie, HttpOnly, SameSite=Lax, Path=/, Secure in production; absolute lifetime 12 hours. 429 after 5 failed attempts per 15 minutes, using separate per-account and per-IP counters; the alias and email share one account counter."
      security: []
      parameters:
        - {"$ref":"#/components/parameters/Origin"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/LoginInput"}
            example: {"email":"owner@example.test","password":"Password supplied by the owner"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
            Set-Cookie:
              schema: {"type":"string"}
              description: "Signed HttpOnly sid session cookie. Store it for subsequent admin calls."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/AdminSession"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "429": {"$ref":"#/components/responses/Error429"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/auth/me":
    get:
      operationId: "get_admin_auth_me"
      tags: ["Authentication"]
      summary: "Đọc phiên và CSRF token"
      description: ""
      security:
        -
          AdminCookie: []
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/AdminMe"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/auth/logout":
    post:
      operationId: "post_admin_auth_logout"
      tags: ["Authentication"]
      summary: "Đăng xuất, thu hồi phiên"
      description: ""
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      responses:
        "204": {"description":"Success; empty body."}
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/current":
    get:
      operationId: "get_admin_events_current"
      tags: ["Administration"]
      summary: "Sự kiện hiện tại cùng nháp/xuất bản"
      description: "Most recently created event owned by this administrator; 404 if none. No event creation endpoint exists."
      security:
        -
          AdminCookie: []
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/EventView"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/draft":
    patch:
      operationId: "patch_admin_events_id_draft"
      tags: ["Administration"]
      summary: "Lưu revision nháp bất biến"
      description: "Creates a new immutable revision and advances draftRevisionId/version atomically. Guest content stays on publishedRevisionId. A stale If-Match returns 409."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
        - {"$ref":"#/components/parameters/IfMatch"}
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                content: {"$ref":"#/components/schemas/Content"}
              required: ["content"]
              additionalProperties: false
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/EventView"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "422": {"$ref":"#/components/responses/Error422"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/publish":
    post:
      operationId: "post_admin_events_id_publish"
      tags: ["Administration"]
      summary: "Công bố nháp đã lưu"
      description: "Validates complete content and references to bundled media before changing the published revision. Failed publish leaves the previous published revision intact."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/VersionInput"}
            example: {"expectedVersion":3}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/EventView"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "422": {"$ref":"#/components/responses/Error422"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/unpublish":
    post:
      operationId: "post_admin_events_id_unpublish"
      tags: ["Administration"]
      summary: "Rút công bố"
      description: "Clears publication and immediately stops every guest read/write while preserving guest/history data. Bundled assets are served separately at public paths."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/VersionInput"}
            example: {"expectedVersion":3}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/EventView"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "422": {"$ref":"#/components/responses/Error422"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/controls":
    patch:
      operationId: "patch_admin_events_id_controls"
      tags: ["Administration"]
      summary: "Đóng/mở form và bức tường ngay"
      description: "At least one boolean is required. Controls apply immediately, independently of content revisions. Closing wishes does not prevent consent withdrawal or deletion on an otherwise active published invitation."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/ControlsInput"}
            example: {"expectedVersion":3,"wishesEnabled":false}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/EventView"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/preview":
    get:
      operationId: "get_admin_events_id_preview"
      tags: ["Administration"]
      summary: "Xem nháp với khách mẫu hoặc khách được chọn"
      description: "Uses only this event's selected guest; no guestId means a sample guest. Returns preview=true, bundled asset URLs, and false write controls. Does not create an open, RSVP or Wish."
      security:
        -
          AdminCookie: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        -
          name: "guestId"
          in: "query"
          required: false
          schema: {"type":"string","format":"uuid"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/InvitationView"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/dashboard":
    get:
      operationId: "get_admin_events_id_dashboard"
      tags: ["Administration"]
      summary: "Thống kê hiện trạng thiệp đang hoạt động"
      description: "Excludes archived guests and revoked invitations. attending + declined + unanswered = total. opened counts distinct active invitations, not repeat opens. Pending wishes are consenting, undeleted and attached to active invitations."
      security:
        -
          AdminCookie: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/Dashboard"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/events/{id}/guests":
    get:
      operationId: "get_admin_events_id_guests"
      tags: ["Administration"]
      summary: "Danh sách khách có tìm kiếm và phân trang"
      description: ""
      security:
        -
          AdminCookie: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Search"}
        - {"$ref":"#/components/parameters/Group"}
        - {"$ref":"#/components/parameters/GuestStatus"}
        - {"$ref":"#/components/parameters/Archived"}
        - {"$ref":"#/components/parameters/Page"}
        - {"$ref":"#/components/parameters/PageSize"}
        - {"$ref":"#/components/parameters/GuestSort"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/GuestPage"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
    post:
      operationId: "post_admin_events_id_guests"
      tags: ["Administration"]
      summary: "Tạo khách và thiệp trong cùng transaction"
      description: ""
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/GuestInput"}
            example:
              guestCode: "BAN001"
              fullName: "Nguyễn An"
              displayName: "An"
              groupKey: "ban_be"
              salutation: "bạn"
              phone: "0123456789"
              personalMessage: "Hẹn gặp {{guestName}}!"
      responses:
        "201":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/AdminGuest"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/guests/{id}":
    patch:
      operationId: "patch_admin_guests_id"
      tags: ["Administration"]
      summary: "Sửa khách và lời nhắn, giữ nguyên link"
      description: "Send the full current form, including expectedVersion (Guest) and expectedInvitationVersion. Omitted optional guest fields default to empty strings. Versions advance only for entities whose data changes. Token, archived status, RSVP and Wish are retained."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/GuestUpdateInput"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/AdminGuest"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "500": {"$ref":"#/components/responses/Error500"}
    delete:
      operationId: "delete_admin_guests_id"
      tags: ["Administration"]
      summary: "Xóa vĩnh viễn khách mời và vô hiệu hóa các link"
      description: "Deletes the owned guest, invitation, RSVP, wish and guest response replays in one transaction. All issued short and legacy links stop working. Short-code hashes stay reserved with identifying link fields removed."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/VersionInput"}
      responses:
        "204": {"description":"Guest deleted"}
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "500": {"$ref":"#/components/responses/Error500"}
        "503": {"$ref":"#/components/responses/Error503"}
  "/admin/guests/{id}/archive":
    post:
      operationId: "post_admin_guests_id_archive"
      tags: ["Administration"]
      summary: "Lưu trữ khách"
      description: "Soft archive: stops guest access and excludes the invitation from active dashboard totals; preserves all data."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/VersionInput"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/AdminGuest"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/guests/{id}/restore":
    post:
      operationId: "post_admin_guests_id_restore"
      tags: ["Administration"]
      summary: "Khôi phục khách"
      description: "Clears archivedAt only. A revoked link remains revoked; rotate the invitation separately to reactivate its link."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref":"#/components/schemas/VersionInput"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/AdminGuest"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/invitations/{id}/link":
    get:
      operationId: "get_admin_invitations_id_link"
      tags: ["Administration"]
      summary: "Lấy URL riêng và tin nhắn để tự gửi"
      description: "Admin-only current ownership check. Decrypts the current token to return a copyable link/message. Does not send anything. Response must never be logged or cached."
      security:
        -
          AdminCookie: []
      parameters:
        - {"$ref":"#/components/parameters/Id"}
      responses:
        "200":
          description: "Success"
          headers:
            Cache-Control:
              schema: {"type":"string"}
              description: "private, no-store for personal JSON, links and exports."
            X-Request-ID:
              schema: {"type":"string","format":"uuid"}
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  data: {"$ref":"#/components/schemas/Link"}
                required: ["data"]
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/admin/invitations/{id}/revoke":
    post:
      operationId: "post_admin_invitations_id_revoke"
      tags: ["Administration"]
      summary: "Thu hồi link ngay"
      description: "Sets revokedAt, invalidates guest access, preserves RSVP/Wish/history."
      security:
        -
          AdminCookie: []
          AdminCsrf: []
