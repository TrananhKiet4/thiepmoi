  "/admin/events/{id}/uploads":
    post:
      operationId: prepare_private_upload
      tags: ["Excel"]
      summary: "Prepare a private XLSX upload; use before sending the file on Vercel"
      description: "IMPORT accepts an .xlsx file up to 5 MiB. At most 20 live PUT capabilities or unclaimed active sources per administrator. Direct URLs expire after 5 minutes; source processing expires after 30 minutes. PUT exactly the declared bytes with returned headers and no app credentials. Inspect can reuse uploadId. Import preview consumes it once. XLSX headers are at most 200 characters and aggregate inspection metadata at most 1 MiB. Local mode returns multipart and uses the multipart inspect and preview requests."
      security: [{"AdminCookie":[],"AdminCsrf":[]}]
      parameters:
        - {"$ref":"#/components/parameters/Id"}
        - {"$ref":"#/components/parameters/Origin"}
        - {"$ref":"#/components/parameters/Csrf"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{"purpose":{"const":"IMPORT"},"name":{"type":"string","minLength":1,"maxLength":255},"bytes":{"type":"integer","minimum":1,"maximum":5242880}},"required":["purpose","name","bytes"],"additionalProperties":false}
      responses:
        "200":
          description: "Direct upload information or local multipart transport"
          content:
            application/json:
              schema: {"type":"object","properties":{"data":{"oneOf":[{"type":"object","properties":{"mode":{"const":"multipart"}},"required":["mode"]},{"type":"object","properties":{"mode":{"const":"direct"},"uploadId":{"type":"string","format":"uuid"},"url":{"type":"string","format":"uri"},"headers":{"type":"object","additionalProperties":{"type":"string"}}},"required":["mode","uploadId","url","headers"]}]}},"required":["data"]}
        "400": {"$ref":"#/components/responses/Error400"}
        "401": {"$ref":"#/components/responses/Error401"}
        "403": {"$ref":"#/components/responses/Error403"}
        "404": {"$ref":"#/components/responses/Error404"}
        "409": {"$ref":"#/components/responses/Error409"}
        "429": {"$ref":"#/components/responses/Error429"}
        "500": {"$ref":"#/components/responses/Error500"}
  "/api/maintenance":
    servers: [{"url":"/"}]
    get:
      operationId: daily_maintenance
      summary: "Authenticated daily Vercel cron"
      description: "Bearer CRON_SECRET (at least 32 random characters). Cleans at most 100 temporary objects within a time budget and at most 1,000 rows per database cleanup job; locked rows are skipped, SQL lock/statement timeouts apply. Failed deletes retain object metadata for retry; failedTasks identifies database jobs to retry."
      security: [{"CronBearer":[]}]
      responses:
        "200": {"description":"Cleanup counts in data; temporaryObjects has deleted/failed counts and failedTasks lists database jobs that failed."}
        "401": {"$ref":"#/components/responses/Error401"}
        "503": {"$ref":"#/components/responses/Error503"}
        "500": {"$ref":"#/components/responses/Error500"}
components:
  securitySchemes:
    CronBearer: {"type":"http","scheme":"bearer"}
    AdminCookie:
      type: "apiKey"
      in: "cookie"
      name: "sid"
      description: "Signed HttpOnly server session cookie. Never substitute an invitation Bearer token. Mutations also require Origin and X-CSRF-Token."
    GuestBearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "Legacy 43-character token, or five-character code followed by a dot and recipient slug"
      description: "For /i/{code}/{guestSlug}, send Authorization: Bearer {code}.{guestSlug}. The five-character code is bound to the issued name and current invitation token. Legacy /i/{token} credentials remain valid. Short-code authentication failures are limited to five per 15 minutes per name across IPs. Successful credentials do not consume that failure budget. A busy database can return 503 DATABASE_BUSY with Retry-After. Every call checks publication, revocation and archive. Writes and replays recheck inside the transaction. Never send credentials in query/body."
    AdminCsrf:
      type: "apiKey"
      in: "header"
      name: "X-CSRF-Token"
      description: "CSRF token tied to the current admin session. Login/GET auth/me returns it; required on authenticated admin mutations together with cookie and allowed Origin."
  parameters:
    Id:
      name: "id"
      in: "path"
      required: true
      schema: {"type":"string","format":"uuid"}
      description: "UUID of the event, guest, invitation, wish or import batch selected by this route. Admin ownership is checked."
    Origin:
      name: "Origin"
      in: "header"
      required: true
      schema: {"type":"string","format":"uri"}
      description: "Required on every admin mutation, including login/logout. Must be in the configured CORS_ORIGINS allowlist (APP_ORIGIN by default)."
    Csrf:
      name: "X-CSRF-Token"
      in: "header"
      required: true
      schema: {"type":"string"}
      description: "Current session CSRF token from login or GET /admin/auth/me. Required with the admin cookie on mutations."
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema: {"type":"string","pattern":"^(?:[1-9]\\d*|\"[1-9]\\d*\")$"}
      description: "Expected Event version; unquoted or double-quoted integer. Stale version returns 409. This API does not use an ETag response header."
    Idempotency:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        maxLength: 128
        minLength: 1
        pattern: "^[-\\w]+$"
        example: "eac12768-fb8c-4d1c-8231-cb67ba18fa17"
      description: "Use a new UUID for a new submission and retain it for retries. Actual validation accepts 1–128 letters, digits, underscore or hyphen. For 24h, same actor/scope/key and canonical body replays the stored result; changed body returns 409. Current access is checked before guest replay. Import hash includes batch ID."
    Page:
      name: "page"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 100000
        default: 1
    PageSize:
      name: "pageSize"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: "q"
      in: "query"
      required: false
      schema: {"type":"string","maxLength":120}
      description: "Case-insensitive guest code, full name or display name search. Empty means no filter."
    Group:
      name: "group"
      in: "query"
      required: false
      schema: {"type":"string","maxLength":60}
      description: "Exact groupKey; empty means no filter."
    GuestStatus:
      name: "status"
      in: "query"
      required: false
      schema:
        type: "string"
        enum: ["ATTENDING","DECLINED","UNANSWERED",""]
      description: "Empty or absent means all response states. UNANSWERED means no RSVP record."
    Archived:
      name: "archived"
      in: "query"
      required: false
      schema:
        type: "string"
        enum: ["true","false","all"]
        default: "false"
      description: "false: unarchived guests; true: archived guests; all: both. This does not itself filter revoked links."
    GuestSort:
      name: "sort"
      in: "query"
      required: false
      schema:
        type: "string"
        enum: ["guestCode","fullName","createdAt","-guestCode","-fullName","-createdAt"]
        default: "guestCode"
      description: "Leading '-' sorts descending; UUID provides a stable tiebreaker."
  responses:
    Error400:
      description: "Invalid JSON, request fields, cursor, header or query."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Dữ liệu không hợp lệ"
              fields: {"expectedVersion":"Required"}
              requestId: "b63b9230-17a7-4dc5-80e8-d441f0ca7688"
    Error401:
      description: "Invalid/expired admin session or missing/unrecognized guest bearer token."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"TOKEN_INVALID","message":"Dữ liệu không hợp lệ","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error403:
      description: "Origin or CSRF check failed. Admin entities owned by someone else return 404."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"CSRF_INVALID","message":"Dữ liệu không hợp lệ","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error404:
      description: "Not found, wrong event owner, archived/revoked invitation, unpublished event or unavailable asset."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"EVENT_NOT_AVAILABLE","message":"Dữ liệu không hợp lệ","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error409:
      description: "Version conflict, duplicate code, changed idempotent body, or stale/expired import."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"VERSION_CONFLICT","message":"Dữ liệu đã thay đổi, vui lòng tải lại","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error413:
      description: "JSON exceeds 100 KB, upload exceeds limits or multipart limits exceeded."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"UPLOAD_LIMIT","message":"Dữ liệu không hợp lệ","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error422:
      description: "Form closed, incomplete publication, unknown or incompatible catalog assets, invalid XLSX, import row errors, or wish not eligible for publication/pinning."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"PUBLICATION_INVALID","message":"Đã đóng nhận lời chúc","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error429:
      description: "Rate limit exceeded; retry after the indicated interval."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
        Retry-After:
          schema: {"type":"integer","minimum":1}
          description: "Seconds to wait."
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"RATE_LIMITED","message":"Dữ liệu không hợp lệ"}
    Error500:
      description: "Unexpected server error; use X-Request-ID when requesting support."
      headers:
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"INTERNAL_ERROR","message":"Dữ liệu không hợp lệ","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
    Error503:
      description: "Dependency not ready, database busy, or audio decoder unavailable."
      headers:
        Retry-After:
          schema: {"type":"integer","minimum":1}
          description: "Seconds to wait before retrying when the database is busy."
        Cache-Control:
          schema: {"type":"string"}
          description: "private, no-store for personal JSON, links and exports."
        X-Request-ID:
          schema: {"type":"string","format":"uuid"}
      content:
        "application/json":
          schema: {"$ref":"#/components/schemas/Error"}
          example:
            error: {"code":"AUDIO_DECODER_UNAVAILABLE","message":"Dữ liệu không hợp lệ","requestId":"b63b9230-17a7-4dc5-80e8-d441f0ca7688"}
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code: {"type":"string"}
            message: {"type":"string"}
            fields:
              type: "object"
              additionalProperties: {"type":"string"}
            requestId: {"type":"string","format":"uuid"}
          required: ["code","message"]
      required: ["error"]
    VersionInput:
      type: "object"
      properties:
        expectedVersion: {"type":"integer","minimum":1}
      required: ["expectedVersion"]
      additionalProperties: false
    Location:
      type: "object"
      properties:
        startAt: {"anyOf":[{"type":"string","format":"date-time"},{"const":""}],"description":"May be empty in draft; required at publication."}
        endAt: {"anyOf":[{"type":"string","format":"date-time"},{"const":""}],"description":"May be empty in draft; required at publication."}
        venueName: {"type":"string","maxLength":200}
        address: {"type":"string","maxLength":500}
        latitude: {"type":"number","minimum":-90,"maximum":90,"deprecated":true,"description":"Legacy input ignored by the new parser."}
        longitude: {"type":"number","minimum":-180,"maximum":180,"deprecated":true,"description":"Legacy input ignored by the new parser."}
        googleMapsUrl: {"type":"string","maxLength":2048,"default":"","description":"Optional HTTPS Maps link: maps.app.goo.gl, maps.google.com, goo.gl/maps or google.com(/.vn)/maps. Other hosts, credentials and ports are rejected; no server-side expansion. Empty falls back to address search."}
        mapImageAssetId: {"type":["string","null"],"format":"uuid","default":null,"description":"Image UUID from the bundled staticMedia catalog."}
        entranceNote: {"type":"string","maxLength":1000}
      required: ["startAt","endAt","venueName","address"]
    OpeningSection:
      type: "object"
      properties:
        id: {"type":"string","maxLength":80,"minLength":1}
        enabled: {"type":"boolean"}
        order: {"type":"integer","minimum":0,"maximum":100}
        type: {"const":"opening"}
        data:
          type: "object"
          properties:
            title: {"type":"string","maxLength":200}
            messageTemplate: {"type":"string","maxLength":1000}
            coverAssetId:
              anyOf:
                - {"type":"string","format":"uuid"}
                - {"type":"null"}
          required: ["title","messageTemplate"]
      required: ["id","enabled","order","type","data"]
    HeroSection:
      type: "object"
      properties:
        id: {"type":"string","maxLength":80,"minLength":1}
        enabled: {"type":"boolean"}
        order: {"type":"integer","minimum":0,"maximum":100}
        type: {"const":"hero"}
        data:
          type: "object"
          properties:
            title: {"type":"string","maxLength":200}
            subtitle: {"type":"string","maxLength":500}
            heroAssetId:
              anyOf:
                - {"type":"string","format":"uuid"}
                - {"type":"null"}
          required: ["title"]
      required: ["id","enabled","order","type","data"]
    StorySection:
      type: "object"
      properties:
        id: {"type":"string","maxLength":80,"minLength":1}
        enabled: {"type":"boolean"}
        order: {"type":"integer","minimum":0,"maximum":100}
