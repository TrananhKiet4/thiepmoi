        "500": {"$ref":"#/components/responses/Error500"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"type":"object","properties":{"uploadId":{"type":"string","format":"uuid"},"sheet":{"type":"string","minLength":1,"maxLength":100},"mapping":{"type":"object","additionalProperties":{"type":"string","maxLength":200},"required":["guest_code","full_name"]}},"required":["uploadId","sheet","mapping"],"additionalProperties":false}
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                file:
