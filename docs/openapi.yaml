                sheet: {"type":"string","maxLength":100,"minLength":1}
                mapping:
                  type: "string"
                  description: "JSON object mapping canonical columns to exact sheet header strings. guest_code and full_name required. Other allowed keys: display_name, group, salutation, personal_message, email, phone. A source header may be mapped only once."
                  example: "{\"guest_code\":\"Mã khách\",\"full_name\":\"Họ tên\",\"phone\":\"Điện thoại\"}"
              required: ["file","sheet","mapping"]
