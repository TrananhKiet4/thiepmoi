        wishDeadline:
          deprecated: true
          default: null
          anyOf:
            - {"type":"string","format":"date-time"}
            - {"type":"null"}
        timezone: {"type":"string","const":"Asia/Ho_Chi_Minh","default":"Asia/Ho_Chi_Minh"}
