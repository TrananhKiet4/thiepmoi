            palette:
              type: "string"
              enum: ["cream","sage","rose","blue"]
              default: "cream"
            font:
              type: "string"
              enum: ["serif","sans","lora","be-vietnam-pro"]
              default: "serif"
          required: []
        music:
          type: "object"
          properties:
            enabled: {"type":"boolean"}
            assetId:
              anyOf:
                - {"type":"string","format":"uuid"}
                - {"type":"null"}
            volume:
              type: "number"
              minimum: 0
              maximum: 1
              default: 0.25
            loop: {"type":"boolean","default":true}
          required: ["enabled"]
        groupMessages:
          deprecated: true
          default: {}
          type: "object"
          maxProperties: 100
          additionalProperties: {"type":"string","maxLength":1000}
        sections:
          type: "array"
          items:
            oneOf:
              - {"$ref":"#/components/schemas/OpeningSection"}
              - {"$ref":"#/components/schemas/HeroSection"}
              - {"$ref":"#/components/schemas/StorySection"}
              - {"$ref":"#/components/schemas/GallerySection"}
              - {"$ref":"#/components/schemas/InvitationSection"}
              - {"$ref":"#/components/schemas/MapSection"}
              - {"$ref":"#/components/schemas/ResponseSection"}
              - {"$ref":"#/components/schemas/ClosingSection"}
            discriminator:
              propertyName: "type"
              mapping:
                opening: "#/components/schemas/OpeningSection"
                hero: "#/components/schemas/HeroSection"
                story: "#/components/schemas/StorySection"
                gallery: "#/components/schemas/GallerySection"
                invitation: "#/components/schemas/InvitationSection"
                map: "#/components/schemas/MapSection"
                response: "#/components/schemas/ResponseSection"
                closing: "#/components/schemas/ClosingSection"
          minItems: 1
          maxItems: 16
      required: ["schemaVersion","host","ceremony","theme","music","sections"]
      additionalProperties: false
      description: "Strings are trimmed and rendered as plain text. Section IDs and section types must each be unique. opening, hero, invitation, map and response must exist and be enabled. Drafts may contain empty descriptive fields. Image and audio references use UUIDs from the bundled staticMedia catalog. Publish additionally requires host name/university/major, venue/address, endAt > startAt, legacy RSVP deadline <= meetup (or ceremony) startAt when set, a hero image, audio when enabled, and a meetup when map uses MEETUP. See packages/contracts/src/index.ts for the content contract and staticMedia catalog. The example uses the bundled demonstration image. Replace the dates, venues and names before publishing."
      example:
        schemaVersion: 1
        host:
          fullName: "Người tốt nghiệp"
          university: "Trường đại học mẫu"
          major: "Ngành học mẫu"
          cohort: "DEMO"
        ceremony:
          startAt: "2099-12-01T02:00:00Z"
          endAt: "2099-12-01T05:00:00Z"
          venueName: "Hội trường mẫu"
          address: "Địa chỉ minh họa"
          googleMapsUrl: "https://maps.app.goo.gl/School123"
          mapImageAssetId: null
          entranceNote: "Cổng vào mẫu"
        meetup: null
        rsvpDeadline: null
        wishDeadline: null
        timezone: "Asia/Ho_Chi_Minh"
        theme: {"palette":"cream","font":"serif"}
        music:
          enabled: false
          assetId: null
          volume: 0.25
          loop: true
        groupMessages: {}
        sections:
          -
            id: "opening"
            enabled: true
            order: 0
            type: "opening"
            data: {"title":"Một lời mời dành riêng cho bạn","messageTemplate":"Thân mời {{guestName}}","coverAssetId":null}
          -
            id: "hero"
            enabled: true
            order: 1
            type: "hero"
            data: {"title":"Hành trình mới","subtitle":"Lễ tốt nghiệp","heroAssetId":"00000000-0000-4000-8000-000000000001"}
          -
            id: "invitation"
            enabled: true
            order: 2
            type: "invitation"
            data: {"title":"Hẹn bạn","message":"Cùng lưu giữ ngày đặc biệt."}
          -
            id: "map"
            enabled: true
            order: 3
            type: "map"
            data: {"title":"Điểm hẹn","locationSource":"CEREMONY","instructions":"Vui lòng đến đúng giờ."}
          -
            id: "response"
            enabled: true
            order: 4
            type: "response"
            data: {"title":"Bạn sẽ đến chứ?","rsvpIntro":"Cho mình biết nhé.","wishIntro":"Gửi lại một lời chúc."}
