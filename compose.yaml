services:
  postgres:
    image: postgres:17-alpine
    ports: ["127.0.0.1:54329:5432"]
    environment:
      POSTGRES_DB: invitations
      POSTGRES_USER: invitation
      POSTGRES_PASSWORD: local_dev_only
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invitation -d invitations"]
      interval: 3s
      retries: 15
volumes:
  postgres-data:
